user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression for text and asset responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Edge Rate Limiting: 30 requests/minute per IP on authentication endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    limit_req_status 429;

    # Upstream Services (Internal Docker Network DNS)
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8080;
        keepalive 32;
    }

    # =========================================================================
    # HTTP Server: Port 80 (ACME Challenge + HTTPS Redirect)
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt / ACME HTTP-01 challenge handling
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP traffic to HTTPS for production
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS Server: Port 443 (TLS Termination + Unified Origin Reverse Proxy)
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # TLS Certificates (Mounted from volume / secrets)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS Security Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Standard Security Response Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # NOTE on HSTS: Enable Strict-Transport-Security ONLY after verifying working HTTPS.
        # Do not enable HSTS preload for unverified domains, staging, or internal hostnames.
        # Example for verified production:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---------------------------------------------------------------------
        # 1. Next.js Immutable Static Chunks Caching
        # ---------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ---------------------------------------------------------------------
        # 2. Next.js Public Assets (Favicons, manifest, etc.)
        # ---------------------------------------------------------------------
        location /favicon.ico {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # ---------------------------------------------------------------------
        # 3. Rate-Limited Authentication Endpoints (Edge Defense-in-Depth)
        # ---------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # 4. Backend REST API Endpoints (/api/v1/)
        # ---------------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # 5. Health Check Probe (Deliberate Security Design)
        # ---------------------------------------------------------------------
        # Exposes the non-sensitive Actuator health check endpoint for ingress
        # load balancers and uptime monitoring without exposing /actuator/** details.
        location = /health {
            proxy_pass http://backend_upstream/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ---------------------------------------------------------------------
        # 6. Frontend Next.js Standalone Application (Default Route)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
