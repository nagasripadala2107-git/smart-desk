# =============================================================================
# SmartDesk Blueprint Deployment Configuration for Render
# Documentation: https://render.com/docs/blueprint-spec
# =============================================================================
version: "1"

databases:
  - name: smartdesk-postgres
    databaseName: smartdesk
    user: smartdesk_user
    plan: free

services:
  # ---------------------------------------------------------------------------
  # 1. Python FastAPI AI Classification Microservice
  # ---------------------------------------------------------------------------
  - type: web
    name: smartdesk-ai
    runtime: docker
    dockerContext: ./ai-service
    dockerfilePath: ./ai-service/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  # ---------------------------------------------------------------------------
  # 2. Spring Boot Core Backend (Java 26)
  # ---------------------------------------------------------------------------
  - type: web
    name: smartdesk-backend
    runtime: docker
    dockerContext: ./backend-java
    dockerfilePath: ./backend-java/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: smartdesk-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartdesk-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smartdesk-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: smartdesk-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartdesk-postgres
          property: password
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: smartdesk-ai
          property: hostport
      - key: AI_TIMEOUT_MS
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: HIBERNATE_DDL_AUTO
        value: validate
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ---------------------------------------------------------------------------
  # 3. Next.js Standalone Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: smartdesk-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: INTERNAL_BACKEND_URL
        fromService:
          type: web
          name: smartdesk-backend
          property: hostport
