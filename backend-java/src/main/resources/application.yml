server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: smartdesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartdesk}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Application Security & Token Settings
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  security:
    rate-limit:
      auth: ${RATE_LIMIT_AUTH_PER_MINUTE:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${AI_TIMEOUT_MS:2000}
    duplicate:
      threshold: ${AI_DUPLICATE_THRESHOLD:0.70}
      max-matches: ${AI_DUPLICATE_MAX_MATCHES:5}
      max-candidates: ${AI_DUPLICATE_MAX_CANDIDATES:50}
