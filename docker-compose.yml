services:
  postgres:
    image: postgres:17
    container_name: smartdesk-postgres
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartdesk_postgres_data:/var/lib/postgresql/data
    networks:
      - smartdesk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdesk"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  ai-service:
    image: smartdesk-ai:phase9
    container_name: smartdesk-ai
    expose:
      - "8000"
    networks:
      - smartdesk-network

  backend:
    image: smartdesk-backend:phase9
    container_name: smartdesk-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartdesk
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT_MS: 3000
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://192.168.1.5:3000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - smartdesk-network

  frontend:
    image: smartdesk-frontend:phase9
    container_name: smartdesk-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://192.168.1.5:8080/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartdesk-network

networks:
  smartdesk-network:
    name: smartdesk-network

volumes:
  smartdesk_postgres_data:
    external: true
