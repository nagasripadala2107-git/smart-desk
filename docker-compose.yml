services:
  postgres:
    image: postgres:17
    container_name: smartdesk-postgres
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartdesk_postgres_data:/var/lib/postgresql/data
      - ./database/init_all.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - smartdesk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdesk"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  ai-service:
    build:
      context: ./ai-service
    image: smartdesk-ai:latest
    container_name: smartdesk-ai
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; res = urllib.request.urlopen('http://localhost:8000/health'); exit(0 if res.getcode() == 200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - smartdesk-network

  backend:
    build:
      context: ./backend-java
    image: smartdesk-backend:latest
    container_name: smartdesk-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartdesk
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT_MS: 3000
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - smartdesk-network

  frontend:
    build:
      context: ./frontend
    image: smartdesk-frontend:latest
    container_name: smartdesk-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartdesk-network

networks:
  smartdesk-network:
    name: smartdesk-network

volumes:
  smartdesk_postgres_data:
